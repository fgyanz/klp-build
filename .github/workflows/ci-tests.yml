# @file ci-tests.yml
---
name: klp-build tests

on:
  pull_request:
    branches:
      - 'devel'
      - 'main'
  push:
    branches:
      - '*'
      - '!devel'
      - '!main'

jobs:
  distribution-check:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest
      options: >-
        --privileged
        --device /dev/fuse
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        zypper --non-interactive install --no-confirm \
          gcc make pkgconf-pkg-config fuse3-devel libgit2-devel \
          python3-devel git python3-pytest tox python3-magic

        # FIXME: FUSE_CAP_PASSTHROUGH negotiates fine but reads against
        # the memfd-backed blob content fail with EIO on this kernel.
        # Build git-fs locally with it forced off until root-caused,
        # instead of installing the packaged binary.
        git clone https://github.com/fgyanz/git-fs /tmp/git-fs
        sed -i 's/conf.passthrough = 1;/conf.passthrough = 0;/' /tmp/git-fs/git-fs.c
        make -C /tmp/git-fs
        make -C /tmp/git-fs install

    - name: Run pylint
      run: >
        tox -e lint --
        --fail-under 9.83
        --fail-on F
        --fail-on unused-variable
        --fail-on unused-import
        --fail-on consider-using-sys-exit
        --fail-on trailing-newlines
        --fail-on dangerous-default-value
        --fail-on wrong-import-order
        --fail-on redefined-argument-from-local
        --fail-on no-else-return
        --fail-on use-dict-literal
        --fail-on unnecessary-negation
        --fail-on inconsistent-return-statements
        --fail-on use-implicit-booleaness-not-len
        --fail-on f-string-without-interpolation
        --fail-on pointless-string-statement
        --fail-on bad-indentation
        --fail-on ungrouped-imports
        --fail-on subprocess-run-check
        --fail-on logging-fstring-interpolation
        --fail-on anomalous-backslash-in-string
        --fail-on unnecessary-comprehension
        --fail-on consider-using-ternary
        --fail-on bare-except
        --fail-on using-assignment-expression-in-unsupported-version
        --fail-on global-variable-not-assigned
      
    - name: Get month
      id: get-month
      run: |
        echo "month=$(date +%m)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache kernel-source
      id: cache-ksrc
      uses: actions/cache@v4
      with:
        path: /root/kernel-source
        key: kernel-source-${{ steps.get-month.outputs.month }}

    - name: Cache kernel.git
      id: cache-kernel
      uses: actions/cache@v4
      with:
        path: /root/kernel
        key: kernel-${{ steps.get-month.outputs.month }}

    - if: ${{ steps.cache-ksrc.outputs.cache-hit != 'true' }}
      # It will take around 25min to download the whole repo.
      # Hopefully we won't have the need to do it very often.
      name: Download kernel-source
      continue-on-error: false
      run: git clone https://github.com/SUSE/kernel-source /root/kernel-source

    - if: ${{ steps.cache-kernel.outputs.cache-hit != 'true' }}
      # It will take around 25min to download the whole repo.
      # Hopefully we won't have the need to do it very often.
      name: Download kernel
      continue-on-error: false
      run: git clone https://github.com/SUSE/kernel /root/kernel

    - name: Run klp-build tests
      env:
        HOME: /root
      run: |
        mkdir -p /root/.config/klp-build &&
        cp tests/config /root/.config/klp-build/ &&
        mkdir -p /root/klp/{livepatches,data,repos} &&
        tox -e tests -- tests/test_{ksrc,analysis,file2config,scan,config,kernel,utils,codestream}.py
